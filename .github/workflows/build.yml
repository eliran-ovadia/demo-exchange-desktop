name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Run tests on every push and PR ──────────────────────
  test:
    name: Tests
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Qt system libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libglib2.0-0 libgl1-mesa-glx libxcb-xinerama0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xfixes0 \
            libegl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest --tb=short

  # ── Build executables (main only, after tests pass) ─────
  build:
    name: Build (${{ matrix.name }})
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            artifact: DemoExchange-windows.zip
          - os: ubuntu-22.04
            name: linux
            artifact: DemoExchange-linux.zip
          - os: macos-latest
            name: macos
            artifact: DemoExchange-macos.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Qt system libraries (Linux)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libglib2.0-0 libgl1-mesa-glx libxcb-xinerama0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xfixes0 \
            libegl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build
        run: pyinstaller DemoExchange.spec --clean

      - name: Package (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: Compress-Archive -Path dist\DemoExchange.exe -DestinationPath ${{ matrix.artifact }}

      - name: Package (Linux / macOS)
        if: matrix.name != 'windows'
        run: zip "${{ matrix.artifact }}" dist/DemoExchange

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 30

  # ── Publish release (main only, after all builds pass) ──
  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%B)
          printf "**Commit:** \`%s\`\n\n%s\n" "$SHORT_SHA" "$COMMIT_MSG" > notes.md
          gh release delete latest --yes 2>/dev/null || true
          git push origin :refs/tags/latest 2>/dev/null || true
          gh release create latest *.zip \
            --title "Latest Build — ${SHORT_SHA}" \
            --notes-file notes.md \
            --latest
