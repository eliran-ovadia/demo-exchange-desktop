<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Dark blue rounded background -->
  <rect width="256" height="256" rx="52" fill="#1e3a8a"/>
  <!-- Three rising bar chart bars (anchored at y=228) -->
  <rect x="28"  y="148" width="44" height="80"  rx="6" fill="white" opacity="0.85"/>
  <rect x="96"  y="88"  width="44" height="140" rx="6" fill="white"/>
  <rect x="164" y="40"  width="44" height="188" rx="6" fill="white" opacity="0.85"/>
  <!-- Trend line connecting bar tops -->
  <polyline points="50,144 118,84 186,36"
            stroke="#93c5fd" stroke-width="6"
            fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Dots at trend line points -->
  <circle cx="50"  cy="144" r="7" fill="#93c5fd"/>
  <circle cx="118" cy="84"  r="7" fill="#93c5fd"/>
  <circle cx="186" cy="36"  r="7" fill="#93c5fd"/>
</svg>
